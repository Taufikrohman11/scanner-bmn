<script>

let scanner = null;
let keranjangPeminjaman = [];




  function tambahKeKeranjang(data) {

  console.log(
    "🛒 Menambahkan ke keranjang:",
    data
  );


  // ==========================================
  // CEK BARANG BMN SUDAH ADA
  // ==========================================

  const sudahAda =
    keranjangPeminjaman.some(
      function(item) {

        return (
          item.jenisBarang === "BMN" &&
          String(item.kodeRegister).trim() ===
          String(data.kodeRegister).trim()
        );

      }
    );


  if (sudahAda) {

    alert(
      "Barang ini sudah ada di keranjang."
    );

    return;

  }


  // ==========================================
  // TAMBAHKAN BMN
  // ==========================================

  keranjangPeminjaman.push({

    jenisBarang:
      "BMN",

    kodeRegister:
      data.kodeRegister || "",

    nup:
      data.nup || "",

    namaBarang:
      data.namaBarang || "",

    merkTipe:
      data.merkTipe || "",

    ruangan:
      data.ruangan || "",

    jumlah:
      1,

    kondisi:
      data.kondisi || "Baik"

  });


  console.log(
    "🛒 BMN berhasil masuk keranjang:",
    keranjangPeminjaman
  );


  alert(
    "✅ Barang BMN ditambahkan ke keranjang."
  );


  // ==========================================
  // TAMPILKAN KERANJANG
  // ==========================================

  tampilKeranjang();


  // ==========================================
  // LANJUTKAN SCAN
  // ==========================================

  lanjutScan();

}

  
function tampilKeranjang() {

  const hasil =
    document.getElementById("hasil");


  if (
    keranjangPeminjaman.length === 0
  ) {

    return;

  }


  /*
   * ==========================================
   * CONTAINER KERANJANG
   * ==========================================
   */

  let html =

    "<div class='keranjang'>" +

    "<div class='keranjang-title'>" +

    "🛒 KERANJANG PEMINJAMAN" +

    "</div>" +

    "<div class='keranjang-count'>" +

    "Jumlah item: " +

    keranjangPeminjaman.length +

    "</div>";


  /*
   * ==========================================
   * DAFTAR BARANG
   * ==========================================
   */

  keranjangPeminjaman.forEach(
    function(item, index) {

      const isNonBMN =
        item.jenisBarang === "NON_BMN";


      html +=

        "<div class='keranjang-item'>" +

        "<b>" +

        (index + 1) +

        ". " +

        (item.namaBarang || "-") +

        "</b>" +

        "<br>" +

        "<small>" +

        (
          isNonBMN
            ? "🔵 NON-BMN"
            : "🟢 BMN"
        ) +

        "</small>" +

        "<br>" +


        (
          isNonBMN

            ?

            "<small>" +

            "Jumlah: " +

            (item.jumlah || 1) +

            "</small>" +

            "<br>" +

            "<small>" +

            "Kondisi: " +

            (item.kondisi || "Baik") +

            "</small>"

            :

            "<small>" +

            "Kode Register: " +

            (item.kodeRegister || "-") +

            "</small>" +

            "<br>" +

            "<small>" +

            "NUP: " +

            (item.nup || "-") +

            "</small>"

        ) +

        "</div>";

    }
  );


  /*
   * ==========================================
   * TOMBOL LANJUT
   * ==========================================
   */

  html +=

    "<button " +

    "class='btn-lanjut' " +

    "onclick='formPeminjamanMassal()'>" +

    "👤 LANJUT KE DATA PEMINJAM" +

    "</button>";


  html +=

    "</div>";


  /*
   * ==========================================
   * TAMPILKAN KERANJANG
   * ==========================================
   */

  hasil.innerHTML =
    html;

}
/*
 * ==========================================
 * URL APPS SCRIPT
 * ==========================================
 */

const API_URL =
"https://script.google.com/macros/s/AKfycbwtH3S8GNBUfV6iWSNdvnVmlR_7_c9bTbhQS_xxEuVzoVD1wgsdV7-z9uorvL1DT4V5fA/exec";


/*
 * ==========================================
 * QR BERHASIL DIBACA
 * ==========================================
 */

function qrBerhasil(decodedText, decodedResult) {

  console.log(
    "QR:",
    decodedText
  );


  /*
   * ==========================================
   * HENTIKAN SCANNER
   * ==========================================
   */

  if (scanner) {

    scanner.stop()

      .then(function() {

        console.log(
          "✅ Scanner berhenti setelah QR berhasil."
        );


        /*
         * Bersihkan scanner
         */

        scanner.clear();

        scanner = null;


        /*
         * Ubah tombol menjadi
         * SCAN BARANG LAGI
         */

        const tombol =
          document.getElementById(
            "btnMulaiScan"
          );


        if (tombol) {

          tombol.innerHTML =
            "📷 SCAN BARANG LAGI";

          tombol.onclick =
            mulaiScanner;

        }

      })

      .catch(function(error) {

        console.log(
          "Scanner stop:",
          error
        );


        scanner = null;


        const tombol =
          document.getElementById(
            "btnMulaiScan"
          );


        if (tombol) {

          tombol.innerHTML =
            "📷 SCAN BARANG LAGI";

          tombol.onclick =
            mulaiScanner;

        }

      });

  }


  /*
   * ==========================================
   * TAMPILKAN LOADING
   * ==========================================
   */

  const hasil =
    document.getElementById(
      "hasil"
    );


  hasil.style.display =
    "block";


  hasil.innerHTML =

    '<div class="loading">' +

    '🔄 Mengambil data barang...' +

    '</div>';


  /*
   * ==========================================
   * KIRIM KE APPS SCRIPT
   * ==========================================
   */

  getStatusBarang(
    decodedText
  );

}

      "</div>" +

      "<div class='keranjang-count'>" +

      "Jumlah item: " +

      keranjangPeminjaman.length +

      "</div>";


    keranjangPeminjaman.forEach(

        const isNonBMN =

          ". " +

          "</b>" +

          "<br>" +

          "<small>" +

          (
            isNonBMN
              ? "🔵 NON-BMN"
              : "🟢 BMN"
          ) +

          "</small>" +

          "<br>" +

          (
            isNonBMN

              ?

              "<small>" +

              "Jumlah: " +

              (item.jumlah || 1) +

              "</small>" +

              "<br>" +

              "<small>" +

              "Kondisi: " +

              (item.kondisi || "Baik") +

              "</small>"

              :

              "<small>" +

              "Kode Register: " +

              (item.kodeRegister || "-") +

              "</small>" +

              "<br>" +

              "<small>" +

              "NUP: " +

              (item.nup || "-") +

              "</small>"
          ) +

          "</div>";

      }
    );


    html +=

  }


  /*
   * ==========================================
   * FORM NON-BMN
   * ==========================================
   */

  html +=

    "<div class='keranjang'>" +

    "<strong>📦 TAMBAH BARANG NON-BMN</strong>" +

    "<br><br>" +


    "<div class='form-group'>" +

    "<label>Nama Barang</label>" +

    "id='namaBarangNonBMN' " +

    "</div>" +


    "<div class='form-group'>" +

    "<label>Jumlah</label>" +

    "<input " +

    "id='jumlahNonBMN' " +

    "type='number' " +

    "min='1' " +

    "value='1'>" +

    "</div>" +


    "<div class='form-group'>" +

    "<label>Kondisi</label>" +

    "<input " +

    "id='kondisiNonBMN' " +

    "value='Baik' " +

    "placeholder='Contoh: Baik'>" +

    "</div>" +


    "<button " +

    "class='btn-pinjam' " +

    "onclick='tambahBarangNonBMN()'>" +

    "➕ TAMBAHKAN KE KERANJANG" +

    "</button>" +


    "<button " +

    "class='btn-lanjut' " +

    "onclick='formPeminjamanMassal()'>" +

    "👤 LANJUT KE DATA PEMINJAM" +

    "</button>" +


    "<button " +

    "class='btn-scan' " +

    "onclick='location.reload()'>" +

    "❌ BATAL" +

    "</button>" +

    "</div>";


  /*
   * ==========================================
   * TAMPILKAN
   * ==========================================
   */

  hasil.style.display = "block";

  hasil.innerHTML =
    html;

}

function tambahBarangNonBMN() {

  console.log(
    "📦 Menambahkan barang Non-BMN ke keranjang..."
  );


  // ==========================================
  // 1. AMBIL DATA FORM
  // ==========================================

  const namaBarang =
    document.getElementById(
      "namaBarangNonBMN"
    ).value.trim();


  const jumlah =
    Number(
      document.getElementById(
        "jumlahNonBMN"
      ).value
    );


  const kondisi =
    document.getElementById(
      "kondisiNonBMN"
    ).value.trim();


  // ==========================================
  // 2. VALIDASI
  // ==========================================

  if (!namaBarang) {

    alert(
      "Nama barang wajib diisi."
    );

    return;

  }


  if (
    !jumlah ||
    jumlah < 1
  ) {

    alert(
      "Jumlah barang minimal 1."
    );

    return;

  }


  if (!kondisi) {

    alert(
      "Kondisi barang wajib diisi."
    );

    return;

  }


  // ==========================================
  // 3. BUAT DATA NON-BMN
  // ==========================================

  const barangNonBMN = {

    jenisBarang:
      "NON_BMN",

    kodeRegister:
      "",

    nup:
      "",

    namaBarang:
      namaBarang,

    merkTipe:
      "",

    ruangan:
      "",

    jumlah:
      jumlah,

    kondisi:
      kondisi

  };


  // ==========================================
  // 4. MASUKKAN KE KERANJANG
  // ==========================================

  keranjangPeminjaman.push(
    barangNonBMN
  );


  console.log(
    "✅ Barang Non-BMN ditambahkan:",
    barangNonBMN
  );


  console.log(
    "🛒 Isi keranjang:",
    keranjangPeminjaman
  );


  // ==========================================
  // 5. TAMPILKAN KERANJANG
  // ==========================================

  tampilKeranjang();

}


  
/*
 * ==========================================
 * AMBIL DATA DARI APPS SCRIPT
 * ==========================================
 */

function getStatusBarang(kodeQR) {

  console.log(
    "Mengirim kode:",
    kodeQR
  );


  /*
   * Callback JSONP unik
   */

  const callbackName =
    "hasilScan_" +
    Date.now();


  /*
   * Buat callback
   */

  window[callbackName] =
    function(response) {

      console.log(
        "Response Apps Script:",
        response
      );

console.log(
  "🔎 CEK BATCH ID:",
  response.batchId
);
      /*
       * Hapus callback
       */

      delete window[callbackName];


      /*
       * Cek hasil
       */

      if (!response.success) {

        tampilError(
          response.message ||
          "Barang tidak ditemukan."
        );

        return;

      }


      /*
       * Tampilkan barang
       */

      tampilBarang(
        response
      );

    };


  /*
   * URL JSONP
   */

  const url =
    API_URL +
    "?kodeQR=" +
    encodeURIComponent(kodeQR) +
    "&callback=" +
    callbackName;


  console.log(
    "URL JSONP:",
    url
  );


  /*
   * Buat script
   */

  const script =
    document.createElement("script");


  script.src = url;


  /*
   * Error koneksi
   */

  script.onerror =
    function() {

      console.error(
        "Gagal menghubungi Apps Script"
      );


      delete window[callbackName];


      tampilError(
        "Gagal menghubungi server Apps Script."
      );

    };


  /*
   * Jalankan JSONP
   */

  document.body.appendChild(
    script
  );

}


/*
 * ==========================================
 * TAMPILKAN BARANG
 * ==========================================
 */

function tampilBarang(response) {

console.log(
  "🔥 TAMPIL RIWAYAT DIPANGGIL",
  response
);



  
  const hasil =
    document.getElementById("hasil");


  const data =
    response.barang;


  const status =
    response.status;

  const dataTerakhir =
    response.dataTerakhir || null;


  
  let html = "";


  /*
   * DATA BARANG
   */

  html +=
    "<strong>📦 DATA BARANG</strong>" +

    "<div class='info'>" +

    "<b>Nama Barang:</b><br>" +
    (data.namaBarang || "-") +

    "<br><br>" +

    "<b>Merk / Tipe:</b><br>" +
    (data.merkTipe || "-") +

    "<br><br>" +

    "<b>Kode Register:</b><br>" +
    (data.kodeRegister || "-") +

    "<br><br>" +

    "<b>NUP:</b><br>" +
    (data.nup || "-") +

    "<br><br>" +

    "<b>Ruangan:</b><br>" +
    (data.ruangan || "-") +

    "<br><br>" +

    "<b>Kondisi:</b><br>" +
    (data.kondisi || "-") +

    "</div>";


  /*
   * ==========================================
   * STATUS TERSEDIA
   * ==========================================
   */

 if (status === "TERSEDIA") {

  html +=

    "<div class='status tersedia'>" +

    "🟢 BARANG TERSEDIA" +

  if (dataTerakhir) {

      "<b>Kondisi Terakhir:</b><br>" +

        dataTerakhir.kondisiSaatKembali ||

      ) +

          ? formatTanggal(

      ) +

      "</div>";

  /*

   * TOMBOL PINJAM LANGSUNG

   */

  html +=

    "<button " +

    "class='btn-pinjam' " +

    "onclick='formPeminjaman(" +

    JSON.stringify(data) +

    ")'>" +

    "📤 PINJAM BARANG" +

   * ==========================================

    "onclick='tambahKeKeranjang(" +

}


  /*

  else if (status === "DIPINJAM") {

      "</div>";


    if (pinjam) {

      html +=

        "<div class='info'>" +

        "<b>Peminjam:</b><br>" +
        (pinjam.namaPeminjam || "-") +

        "<br><br>" +

        "<b>NIP / NIK:</b><br>" +
        (pinjam.nipNik || "-") +

        "<br><br>" +

        (pinjam.unit || "-") +

        "<b>Keperluan:</b><br>" +
        (pinjam.keperluan || "-") +

        "<br><br>" +

        "<b>Rencana Kembali:</b><br>" +
        formatTanggal(
          pinjam.tanggalRencanaKembali

        "<b>Kondisi Saat Pinjam:</b><br>" +
        (pinjam.kondisiSaatPinjam || "-") +

        "</div>";


      html +=

        "<button " +

        "class='btn-kembali' " +

        "onclick='formPengembalian(" +

        JSON.stringify(data) +

        ")'>" +

        "↩️ KEMBALIKAN BARANG" +

        "</button>";

      

      /*
 * ==========================================
 * PENGEMBALIAN MASSAL
 * ==========================================
 */

if (
  pinjam &&
  pinjam.batchId
) {

  html +=

    "<button " +

    "class='btn-kembali-massal' " +

    "onclick='formPengembalianMassal(" +

    JSON.stringify(pinjam) +

    ")'>" +

    "📦 KEMBALIKAN SEMUA BARANG" +

    "</button>";

}

    }

  }

  /*
   * ==========================================
   * RIWAYAT TRANSAKSI

   */

  html +=

  /*

   hasil.innerHTML =

function formPengembalianMassal(pinjam) {

  const hasil =
    document.getElementById("hasil");


  /*

function ambilBarangByBatchId(pinjam) {

  console.log(
    "📦 Mengambil barang dalam batch:",
    pinjam.batchId
  );


  /*
   * ==========================================
   * CALLBACK JSONP
   * ==========================================
   */

  const callbackName =
    "hasilBarangBatch_" +
    Date.now();


  window[callbackName] =
    function(response) {

      console.log(
        "📥 Response barang batch:",
        response
      );


      /*
       * Hapus callback
       */

      delete window[callbackName];


      /*
       * Jika gagal
       */

      if (!response.success) {

        const hasil =
          document.getElementById("hasil");

        hasil.innerHTML +=

          "<div class='info'>" +

          "❌ " +

          (
            response.message ||
            "Gagal mengambil daftar barang."
          ) +

          "</div>";

        return;

      }


      /*
       * Tampilkan daftar barang
       */

      tampilDaftarBarangBatch(
        pinjam,
        response
      );

    };


  /*
   * ==========================================
   * URL JSONP
   * ==========================================
   */

  const url =
    API_URL +

    "?action=getBarangByBatchId" +

    "&batchId=" +

    encodeURIComponent(
      pinjam.batchId
    ) +

    "&callback=" +

    callbackName;


  console.log(
    "🌐 URL Barang Batch:",
    url
  );


  /*
   * ==========================================
   * SCRIPT JSONP
   * ==========================================
   */

  const script =
    document.createElement("script");


  script.src =
    url;


  /*
   * Error koneksi
   */

  script.onerror =
    function() {

      console.error(
        "❌ Gagal mengambil barang dalam batch."
      );


      delete window[callbackName];


      const hasil =
        document.getElementById("hasil");

      hasil.innerHTML +=

        "<div class='info'>" +

        "❌ Gagal mengambil daftar barang." +

        "</div>";

    };


  document.body.appendChild(
    script
  );

}

function konfirmasiPengembalianMassal(
  pinjam,
  barang
) {

   * ==========================================
   */

  barang.forEach(
    function(item, index) {

      daftarBarang +=

        (index + 1) +
        ". " +
        (item.namaBarang || "-") +

        "\n" +

        "   NUP: " +
        (item.nup || "-") +

        "\n" +

        "   Kode: " +
        (item.kodeRegister || "-") +

        "\n\n";

    }
  );


  /*

   * ==========================================
   */

  const yakin =
    confirm(

      "⚠️ KONFIRMASI PENGEMBALIAN\n\n" +

      "Anda akan mengembalikan " +

      barang.length +

      " barang sekaligus.\n\n" +

      "Batch ID:\n" +

      pinjam.batchId +

      "\n\n" +

      "Peminjam:\n" +

      (pinjam.namaPeminjam || "-") +

      "\n\n" +

      "DAFTAR BARANG:\n\n" +

      daftarBarang +

      "Apakah Anda yakin ingin mengembalikan semua barang tersebut?"

    );


  /*
   * ==========================================
   * BATAL
   * ==========================================
   */

  if (!yakin) {

    console.log(
      "Pengembalian massal dibatalkan."
    );

    return;

  }


  /*
   * ==========================================
   * LANJUTKAN
   * ==========================================
   */

  simpanPengembalian();

}

  /*
   * ==========================================

   * ==========================================
   */

    "hasilCariPegawai_" +
    Date.now();


  window[callbackName] =
    function(response) {

console.log(
  "📥 HASIL CARI PEGAWAI:",

);


      
      console.log(

function tampilPreviewFotoPeminjaman(input) {

  previewFotoPeminjaman.innerHTML = "";

  const files =
    Array.from(input.files || []);

  if (files.length === 0) {
    return;
  }

  files.forEach(function(file) {

    if (!file.type.startsWith("image/")) {
      return;
    }

    const reader =
      new FileReader();

    reader.onload = function(e) {

      const img =
        document.createElement("img");

      img.src =
        e.target.result;

      img.style.width = "120px";
      img.style.height = "120px";
      img.style.objectFit = "cover";
      img.style.borderRadius = "8px";
      img.style.margin = "5px";
      img.style.border = "1px solid #ccc";

      previewFotoPeminjaman
        .appendChild(img);

    };

    reader.readAsDataURL(file);

  });
}

function fileToBase64(file) {

  return new Promise(function(resolve, reject) {

    const reader =
      new FileReader();

    reader.onload = function() {

      const hasil =
        reader.result
          .split(",")[1];

      resolve(hasil);

    };

    reader.onerror = function(error) {

      reject(error);

    };

    reader.readAsDataURL(file);

  });

}

        mode: "no-cors",

        body: JSON.stringify(payload)
      });

    });

/*
 * ==========================================
 * JSONP UMUM
 * ==========================================
 */

function panggilJSONP(
  fungsi,
  data,
  callback
) {

  /*
   * Untuk tahap awal,
   * kita akan menggunakan parameter
   * action pada Apps Script.
   */

  const callbackName =
    "callback_" +
    Date.now();


  window[callbackName] =
    callback;


  const url =
    API_URL +
    "?action=" +
    encodeURIComponent(fungsi) +
    "&data=" +
    encodeURIComponent(
      JSON.stringify(data)
    ) +
    "&callback=" +
    callbackName;


  const script =
    document.createElement(
      "script"
    );


  script.src =
    url;


  script.onerror =
    function() {

      delete window[callbackName];

      tampilError(
        "Gagal menghubungi server Apps Script."
      );

    };


  document.body.appendChild(
    script
  );

}

 * ==========================================
 */

function formatTanggal(tanggal) {

  if (!tanggal) {

    return "-";

  }


  const d =
    new Date(tanggal);


  if (isNaN(d)) {

    return tanggal;

  }


  return d.toLocaleDateString(
    "id-ID",
    {
      day: "2-digit",
      month: "long",
      year: "numeric"
    }
  );

}

  scanner.stop()

    .then(function() {

  function cariPeminjaman() {

  console.log(
    "🔎 Mencari barang yang masih dipinjam..."
  );


  const input =
    document.getElementById(
      "keywordPengembalian"
    );


  const hasil =
    document.getElementById(
      "hasil"
    );


  if (!input || !hasil) {

    console.error(
      "❌ Elemen form tidak ditemukan."
    );

    return;

  }


  const keyword =
    input.value.trim();


  if (keyword.length < 2) {

    alert(
      "Masukkan minimal 2 karakter nama peminjam."
    );

    return;

  }


  hasil.innerHTML =

    "<div class='loading'>" +

    "🔎 Mencari barang..." +

    "</div>";


  // ==========================================
  // CALLBACK JSONP
  // ==========================================

  const callbackName =
    "hasilCariPeminjaman_" +
    Date.now();


  window[callbackName] =
    function(response) {

      console.log(
        "📥 Response pencarian:",
        response
      );


      delete window[
        callbackName
      ];


      if (
        !response ||
        !response.success
      ) {

        hasil.innerHTML =

          "<div class='info'>" +

          "❌ " +

          (
            response &&
            response.message
              ? response.message
              : "Gagal mencari barang."
          ) +

          "</div>";

        return;

      }


      if (
        !response.data ||
        response.data.length === 0
      ) {

        hasil.innerHTML =

          "<div class='info'>" +

          "❌ Tidak ada barang yang sedang dipinjam oleh " +

          keyword +

          ".</div>";

        return;

      }


      // ======================================
      // TAMPILKAN HASIL
      // ======================================

      let html =

        "<div class='keranjang'>" +

        "<div class='keranjang-title'>" +

        "🔄 BARANG YANG SEDANG DIPINJAM" +

        "</div>";


      html +=

        "<div class='info'>" +

        "<b>Peminjam:</b><br>" +

        response.data[0].namaPeminjam +

        "</div>";


      response.data.forEach(
        function(item, index) {

          const isNonBMN =
            item.jenisBarang ===
            "NON_BMN";


          html +=

            "<div class='keranjang-item'>" +

            "<label style='display:block; cursor:pointer;'>" +

            "<input " +

            "type='checkbox' " +

            "class='checkbox-pengembalian' " +

            "value='" +

            index +

            "' " +

            "style='margin-right:8px;'>" +

            "<b>" +

            (index + 1) +

            ". " +

            (
              item.namaBarang ||
              "-"
            ) +

            "</b>" +

            "</label>" +

            "<small>" +

            (
              isNonBMN
                ? "🔵 NON-BMN"
                : "🟢 BMN"
            ) +

            "</small>" +

            "<br>" +

            (
              isNonBMN

                ?

                "<small>" +
                "Jumlah: " +
                (item.jumlah || 1) +
                "</small>"

                :

                "<small>" +
                "Kode Register: " +
                (item.kodeRegister || "-") +
                "</small>"
            ) +

            "<br>" +

            "<small>" +

            "Kondisi saat pinjam: " +

            (
              item.kondisiSaatPinjam ||
              "Tidak diketahui"
            ) +

            "</small>" +

            "</div>";

        }
      );


      // ======================================
      // TOMBOL PROSES
      // ======================================

      html +=

        "<button " +

        "class='btn-pinjam' " +

        "onclick='formProsesPengembalian(" +

        JSON.stringify(
          response.data
        ).replace(
          /"/g,
          "&quot;"
        ) +

        ")'>" +

        "🔄 PROSES PENGEMBALIAN" +

        "</button>";


      html +=
        "</div>";


      hasil.innerHTML =
        html;

    };


  // ==========================================
  // URL API
  // ==========================================

  const url =

    API_URL +

    "?action=cariBarangDipinjam" +

    "&keyword=" +

    encodeURIComponent(
      keyword
    ) +

    "&callback=" +

    callbackName;


  console.log(
    "🌐 URL pencarian:",
    url
  );


  const script =
    document.createElement(
      "script"
    );


  script.src =
    url;


  script.onerror =
    function() {

      console.error(
        "❌ Gagal menghubungi Apps Script."
      );


      delete window[
        callbackName
      ];


      hasil.innerHTML =

        "<div class='info'>" +

        "❌ Gagal menghubungi server." +

        "</div>";

    };


  document.body.appendChild(
    script
  );

}






 function formProsesPengembalian(data) {

  console.log(
    "🔄 Membuka form proses pengembalian:",
    data
  );


  const hasil =
    document.getElementById("hasil");


  if (!hasil) {

    console.error(
      "❌ Elemen #hasil tidak ditemukan."
    );

    return;

  }


  // ==========================================
  // CEK BARANG YANG DIPILIH
  // ==========================================

  const checkbox =
    document.querySelectorAll(
      ".checkbox-pengembalian:checked"
    );

   console.log(
  "☑️ CHECKBOX TERPILIH:",
  checkbox.length
);

  if (
    checkbox.length === 0
  ) {

    alert(
      "Pilih minimal satu barang yang akan dikembalikan."
    );

    return;

  }


  // ==========================================
  // AMBIL BARANG YANG DIPILIH
  // ==========================================

  const barangDipilih = [];

const idSudahDipilih = new Set();


checkbox.forEach(
  function(cb) {

    const index =
      Number(cb.value);


    const item =
      data[index];


    if (!item) {
      return;
    }


    const idTransaksi =
      String(
        item.idTransaksi || ""
      ).trim();


    // ========================================
    // CEGAH DUPLIKAT
    // ========================================

    if (
      idTransaksi &&
      idSudahDipilih.has(
        idTransaksi
      )
    ) {

      console.warn(
        "⚠️ Duplikat diabaikan:",
        idTransaksi
      );

      return;

    }


    if (idTransaksi) {

      idSudahDipilih.add(
        idTransaksi
      );

    }


    barangDipilih.push(
      item
    );

  }
);

// SIMPAN DATA
