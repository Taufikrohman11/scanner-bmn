<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Scanner BMN</title>

  <script src="https://unpkg.com/html5-qrcode"
          type="text/javascript">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    .header {
      background: #111827;
      color: white;
      padding: 20px;
      border-radius: 16px;
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      margin: 0;
      font-size: 23px;
    }

    .header p {
      margin: 8px 0 0;
      opacity: .8;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }

    #reader {
      width: 100%;
    }

    #hasil {
      margin-top: 20px;
      padding: 15px;
      background: #dcfce7;
      border-radius: 10px;
      word-break: break-all;
      display: none;
    }

    #error {
      margin-top: 20px;
      padding: 15px;
      background: #fee2e2;
      color: #991b1b;
      border-radius: 10px;
      display: none;
    }

  </style>

</head>


<body>

<div class="container">

  <div class="header">

    <h1>📷 SCANNER BMN</h1>

    <p>BPVP Lombok Timur</p>

  </div>


  <div class="card">

    <div id="reader"></div>

    <div id="hasil"></div>

    <div id="error"></div>

  </div>

</div>


<script>

let scanner;
const API_URL =
"https://script.google.com/macros/s/AKfycbwtH3S8GNBUfV6iWSNdvnVmlR_7_c9bTbhQS_xxEuVzoVD1wgsdV7-z9uorvL1DT4V5fA/exec";

/* QR BERHASIL DIBACA */

function qrBerhasil(
  decodedText,
  decodedResult
) {

  console.log(
    "QR:",
    decodedText
  );


  if (scanner) {

    scanner.stop()
      .then(function() {

        console.log(
          "Scanner dihentikan"
        );

      })
      .catch(function(error) {

        console.log(error);

      });

  }

function cariBarang(kodeQR) {

  console.log(
    "Mengirim kode:",
    kodeQR
  );

function tampilBarang(data) {

  const hasil =
    document.getElementById(
      "hasil"
    );


  hasil.style.display =
    "block";


  hasil.innerHTML =

    "<strong>📦 BARANG DITEMUKAN</strong>" +

    "<br><br>" +

    "<b>Nama Barang:</b><br>" +
    (data.namaBarang || "-") +

    "<br><br>" +

    "<b>Merk / Tipe:</b><br>" +
    (data.merkTipe || "-") +

    "<br><br>" +

    "<b>Kode Register:</b><br>" +
    (data.kodeRegister || "-") +

    "<br><br>" +

    "<b>NUP:</b><br>" +
    (data.nup || "-") +

    "<br><br>" +

    "<b>Ruangan:</b><br>" +
    (data.ruangan || "-") +

    "<br><br>" +

    "<b>Kondisi:</b><br>" +
    (data.kondisi || "-") +

    "<br><br>" +

    "<button onclick='location.reload()'>" +
    "📷 SCAN BARANG LAIN" +
    "</button>";

}


function tampilError(pesan) {

  const error =
    document.getElementById(
      "error"
    );


  error.style.display =
    "block";


  error.innerHTML =
    "❌ " + pesan;

}
  /*
   * Buat nama callback unik
   */

  const callbackName =
    "hasilScan_" +
    Date.now();


  /*
   * Buat fungsi callback
   */

  window[callbackName] =
    function(response) {

      console.log(
        "Response Apps Script:",
        response
      );


      /*
       * Hapus script JSONP
       */

      if (script.parentNode) {

        script.parentNode
          .removeChild(script);

      }


      /*
       * Hapus callback
       */

      delete window[
        callbackName
      ];


      /*
       * Barang tidak ditemukan
       */

      if (!response.success) {

        tampilError(

          response.message ||
          "Barang tidak ditemukan."

        );

        return;

      }


      /*
       * Barang ditemukan
       */

      tampilBarang(
        response.data
      );

    };


  /*
   * Buat URL JSONP
   */

  const url =
    API_URL +
    "?kodeQR=" +
    encodeURIComponent(kodeQR) +
    "&callback=" +
    callbackName;


  console.log(
    "URL JSONP:",
    url
  );


  /*
   * Buat element script
   */

  const script =
    document.createElement(
      "script"
    );


  script.src =
    url;


  /*
   * Kalau gagal
   */

  script.onerror =
    function() {

      console.error(
        "Gagal menghubungi Apps Script"
      );


      delete window[
        callbackName
      ];


      tampilError(
        "❌ Gagal menghubungi server Apps Script."
      );

    };


  /*
   * Masukkan ke halaman
   */

  document.body.appendChild(
    script
  );

}
  /*
   * Tampilkan proses pencarian
   */

  const hasil =
    document.getElementById(
      "hasil"
    );

  hasil.style.display =
    "block";

  hasil.innerHTML =
    "🔄 Mencari data barang...";


  /*
   * Kirim QR ke Apps Script
   */

  cariBarang(
    decodedText
  );

}


/* ERROR SCAN */

function qrError(errorMessage) {

}


/* MULAI SCANNER */

function mulaiScanner() {


  scanner =
    new Html5Qrcode(
      "reader"
    );


  const config = {

    fps: 10,

    qrbox: {
      width: 250,
      height: 250
    }

  };


  scanner.start(

    {
      facingMode:
        "environment"
    },

    config,

    qrBerhasil,

    qrError

  )

  .catch(function(error) {


    console.error(error);


    const errorBox =
      document.getElementById(
        "error"
      );


    errorBox.style.display =
      "block";


    errorBox.innerHTML =
      "❌ Kamera tidak dapat digunakan.<br><br>" +
      error;

  });

}


/* JALANKAN */

window.onload =
  function() {

    mulaiScanner();

  };

</script>

</body>

</html>
