<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Scanner BMN</title>

  <script src="https://unpkg.com/html5-qrcode"
          type="text/javascript">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    .header {
      background: #111827;
      color: white;
      padding: 20px;
      border-radius: 16px;
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      margin: 0;

    .header p {
      margin: 8px 0 0;
      opacity: .8;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 16px;

    #reader {
      width: 100%;
    }

    #hasil {
      margin-top: 20px;

    button {
      width: 100%;

    }

    .btn-pinjam {
      background: #16a34a;
      color: white;
    }

    .btn-kembali {
      background: #dc2626;
      color: white;
    }

    .btn-scan {
      background: #111827;
      color: white;
    }

    .form-group {
      margin-top: 12px;
    }

    .form-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 11px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
    }

    .loading {
      text-align: center;
      padding: 15px;
      font-weight: bold;
    }

   /* ==========================================
   RIWAYAT TRANSAKSI
   ========================================== */

#riwayat {
  width: 100%;
  display: block;
  position: relative;
  margin-top: 20px;
  padding: 20px;
  background: white;
  color: #111827;
  box-sizing: border-box;
  border-radius: 14px;
}

.riwayat-title {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 8px;
}

.riwayat-count {
  font-size: 14px;
  color: #6b7280;
  margin-bottom: 15px;
}

.riwayat-item {
  background: #f9fafb !important;
  border: 1px solid #e5e7eb !important;
  border-radius: 10px;
  padding: 15px;
  margin-bottom: 12px;
  line-height: 1.5;
}

  </style>

</head>


<body>

<div class="container">

  <div class="header">

    <h1>📷 SCANNER BMN</h1>

    <p>BPVP Lombok Timur</p>

  </div>


  <div class="card">

    <div id="reader"></div>

    <div id="hasil"></div>

    <div id="error"></div>

  </div>

</div>


<script>

let scanner = null;
let keranjangPeminjaman = [];




  function tambahKeKeranjang(data) {

  console.log(
    "🛒 Menambahkan ke keranjang:",
    data
  );


  // ==========================================
  // CEK BARANG SUDAH ADA
  // ==========================================

  const sudahAda =
    keranjangPeminjaman.some(
      function(item) {

        return (
          String(item.kodeRegister).trim() ===
          String(data.kodeRegister).trim()
        );

      }
    );


  if (sudahAda) {

    alert(
      "Barang ini sudah ada di keranjang."
    );

    return;

  }


  // ==========================================
  // TAMBAHKAN BARANG
  // ==========================================

  keranjangPeminjaman.push({

    kodeRegister:
      data.kodeRegister || "",

    nup:
      data.nup || "",

    namaBarang:
      data.namaBarang || "",

    merkTipe:
      data.merkTipe || "",

    ruangan:
      data.ruangan || "",

    kondisi:
      data.kondisi || ""

  });


  console.log(
    "🛒 Isi keranjang:",
    keranjangPeminjaman
  );


  alert(
    "✅ Barang ditambahkan ke keranjang."
  );

    tampilKeranjang();
    lanjutScan();

}
function tampilKeranjang() {

  const hasil =
    document.getElementById("hasil");

  if (
    keranjangPeminjaman.length === 0
  ) {

    return;

  }

  let html =

    "<div class='keranjang'>" +

    "<div class='keranjang-title'>" +

    "🛒 KERANJANG PEMINJAMAN" +

    "</div>" +

    "<div class='keranjang-count'>" +

    "Jumlah barang: " +

    keranjangPeminjaman.length +

    "</div>";


  /*
   * DAFTAR BARANG
   */

  keranjangPeminjaman.forEach(
    function(item, index) {

      html +=

        "<div class='keranjang-item'>" +

        "<b>" +

        (index + 1) +

        ". " +

        (item.namaBarang || "-") +

        "</b>" +

        "<br>" +

        "<small>" +

        "Kode Register: " +

        (item.kodeRegister || "-") +

        "</small>" +

        "<br>" +

        "<small>" +

        "NUP: " +

        (item.nup || "-") +

        "</small>" +

        "</div>";

    }
  );


  /*
   * TOMBOL LANJUT
   */

  html +=

    "<button " +

    "class='btn-lanjut' " +

    "onclick='formPeminjamanMassal()'>" +

    "👤 LANJUT KE DATA PEMINJAM" +

    "</button>";


  html +=

    "</div>";


  /*
   * Tambahkan ke halaman
   */

  hasil.innerHTML += html;

}
/*
 * ==========================================
 * URL APPS SCRIPT
 * ==========================================
 */

const API_URL =
"https://script.google.com/macros/s/AKfycbwtH3S8GNBUfV6iWSNdvnVmlR_7_c9bTbhQS_xxEuVzoVD1wgsdV7-z9uorvL1DT4V5fA/exec";


/*
 * ==========================================
 * QR BERHASIL DIBACA
 * ==========================================
 */

function qrBerhasil(decodedText, decodedResult) {

  console.log(
    "QR:",
    decodedText
  );


  /*
   * Hentikan scanner
   */

  if (scanner) {

    scanner.stop()
      .catch(function(error) {

        console.log(
          "Scanner stop:",
          error
        );

      });

  }


  /*
   * Tampilkan loading
   */

  const hasil =
    document.getElementById("hasil");

  hasil.style.display = "block";

  hasil.innerHTML =
    '<div class="loading">' +
    '🔄 Mengambil data barang...' +
    '</div>';


  /*
   * Kirim ke Apps Script
   */

  getStatusBarang(decodedText);

}


/*
 * ==========================================
 * AMBIL DATA DARI APPS SCRIPT
 * ==========================================
 */

function getStatusBarang(kodeQR) {

  console.log(
    "Mengirim kode:",
    kodeQR
  );


  /*
   * Callback JSONP unik
   */

  const callbackName =
    "hasilScan_" +
    Date.now();


  /*
   * Buat callback
   */

  window[callbackName] =
    function(response) {

      console.log(
        "Response Apps Script:",
        response
      );


      /*
       * Hapus callback
       */

      delete window[callbackName];


      /*
       * Cek hasil
       */

      if (!response.success) {

        tampilError(
          response.message ||
          "Barang tidak ditemukan."
        );

        return;

      }


      /*
       * Tampilkan barang
       */

      tampilBarang(
        response
      );

    };


  /*
   * URL JSONP
   */

  const url =
    API_URL +
    "?kodeQR=" +
    encodeURIComponent(kodeQR) +
    "&callback=" +
    callbackName;


  console.log(
    "URL JSONP:",
    url
  );


  /*
   * Buat script
   */

  const script =
    document.createElement("script");


  script.src = url;


  /*
   * Error koneksi
   */

  script.onerror =
    function() {

      console.error(
        "Gagal menghubungi Apps Script"
      );


      delete window[callbackName];


      tampilError(
        "Gagal menghubungi server Apps Script."
      );

    };


  /*
   * Jalankan JSONP
   */

  document.body.appendChild(
    script
  );

}


/*
 * ==========================================
 * TAMPILKAN BARANG
 * ==========================================
 */

function tampilBarang(response) {

console.log(
  "🔥 TAMPIL RIWAYAT DIPANGGIL",
  response
);



  
  const hasil =
    document.getElementById("hasil");


  const data =
    response.barang;


  const status =
    response.status;

  const dataTerakhir =
    response.dataTerakhir || null;


  
  let html = "";


  /*
   * DATA BARANG
   */

  html +=
    "<strong>📦 DATA BARANG</strong>" +

    "<div class='info'>" +

    "<b>Nama Barang:</b><br>" +
    (data.namaBarang || "-") +

    "<br><br>" +

    "<b>Merk / Tipe:</b><br>" +
    (data.merkTipe || "-") +

    "<br><br>" +

    "<b>Kode Register:</b><br>" +
    (data.kodeRegister || "-") +

    "<br><br>" +

    "<b>NUP:</b><br>" +
    (data.nup || "-") +

    "<br><br>" +

    "<b>Ruangan:</b><br>" +
    (data.ruangan || "-") +

    "<br><br>" +

    "<b>Kondisi:</b><br>" +
    (data.kondisi || "-") +

    "</div>";


  /*
   * ==========================================
   * STATUS TERSEDIA
   * ==========================================
   */

 if (status === "TERSEDIA") {

  html +=

    "<div class='status tersedia'>" +

    "🟢 BARANG TERSEDIA" +

    "</div>";


  /*
   * ==========================================
   * KONDISI TERAKHIR
   * ==========================================
   */

  if (dataTerakhir) {

    html +=

      "<div class='info'>" +

      "<b>Kondisi Terakhir:</b><br>" +

      (
        dataTerakhir.kondisiSaatKembali ||
        "Belum ada data"
      ) +

      "<br><br>" +

      "<b>Terakhir Dikembalikan:</b><br>" +

      (
        dataTerakhir.tanggalKembali
          ? formatTanggal(
              dataTerakhir.tanggalKembali
            )
          : "Belum ada data"
      ) +

      "</div>";

  }


  /*
   * ==========================================
   * TOMBOL PINJAM LANGSUNG
   * ==========================================
   */

  html +=

    "<button " +

    "class='btn-pinjam' " +

    "onclick='formPeminjaman(" +

    JSON.stringify(data) +

    ")'>" +

    "📤 PINJAM BARANG" +

    "</button>";


  /*
   * ==========================================
   * TOMBOL KERANJANG
   * ==========================================
   */

  html +=

    "<button " +

    "class='btn-pinjam' " +

    "onclick='tambahKeKeranjang(" +

    JSON.stringify(data) +

    ")'>" +

    "🛒 TAMBAHKAN KE KERANJANG" +

    "</button>";

}


  /*
   * ==========================================
   * STATUS DIPINJAM
   * ==========================================
   */

  else if (status === "DIPINJAM") {

    const pinjam =
      response.peminjaman;


    html +=

      "<div class='status dipinjam'>" +

      "🔴 SEDANG DIPINJAM" +

      "</div>";


    if (pinjam) {

      html +=

        "<div class='info'>" +

        "<b>Peminjam:</b><br>" +
        (pinjam.namaPeminjam || "-") +

        "<br><br>" +

        "<b>NIP / NIK:</b><br>" +
        (pinjam.nipNik || "-") +

        "<br><br>" +

        "<b>Unit:</b><br>" +
        (pinjam.unit || "-") +

        "<br><br>" +

        "<b>Keperluan:</b><br>" +
        (pinjam.keperluan || "-") +

        "<br><br>" +

        "<b>Rencana Kembali:</b><br>" +
        formatTanggal(
          pinjam.tanggalRencanaKembali
        ) +

        "<br><br>" +

        "<b>Kondisi Saat Pinjam:</b><br>" +
        (pinjam.kondisiSaatPinjam || "-") +

        "</div>";


      html +=

        "<button " +

        "class='btn-kembali' " +

        "onclick='formPengembalian(" +

        JSON.stringify(data) +

        ")'>" +

        "↩️ KEMBALIKAN BARANG" +

        "</button>";

      

      /*
 * ==========================================
 * PENGEMBALIAN MASSAL
 * ==========================================
 */

if (
  pinjam &&
  pinjam.batchId
) {

  html +=

    "<button " +

    "class='btn-kembali-massal' " +

    "onclick='formPengembalianMassal(" +

    JSON.stringify(pinjam) +

    ")'>" +

    "📦 KEMBALIKAN SEMUA BARANG" +

    "</button>";

}

    }

  }

  /*
   * ==========================================
   * RIWAYAT TRANSAKSI
   * ==========================================
   */

  html +=

    "<div id='riwayat'>" +

    "<div class='riwayat-loading'>" +

    "🔄 Memuat riwayat transaksi..." +

    "</div>" +

    "</div>";
  /*
   * TOMBOL SCAN ULANG
   */

  html +=

    "<button " +

    "class='btn-scan' " +

    "onclick='location.reload()'>" +

    "📷 SCAN BARANG LAIN" +

    "</button>";


   hasil.innerHTML =
    html;


  hasil.style.display =
    "block";


  /*
   * ==========================================
   * AMBIL RIWAYAT TRANSAKSI
   * ==========================================
   */

  ambilRiwayatBarang(
    data.kodeRegister
  );

}

function formPengembalianMassal(pinjam) {

  const hasil =
    document.getElementById("hasil");


  /*
   * ==========================================
   * VALIDASI BATCH
   * ==========================================
   */

  if (
    !pinjam ||
    !pinjam.batchId
  ) {

    alert(
      "Batch ID tidak ditemukan."
    );

    return;

  }


  /*
   * ==========================================
   * TAMPILKAN LOADING
   * ==========================================
   */

  hasil.innerHTML =

    "<strong>📦 PENGEMBALIAN MASSAL</strong>" +

    "<br><br>" +

    "<div class='info'>" +

    "<b>Batch ID:</b><br>" +

    pinjam.batchId +

    "<br><br>" +

    "<b>Peminjam:</b><br>" +

    (pinjam.namaPeminjam || "-") +

    "<br><br>" +

    "<b>NIP / NIK:</b><br>" +

    (pinjam.nipNik || "-") +

    "<br><br>" +

    "<b>Unit:</b><br>" +

    (pinjam.unit || "-") +

    "</div>" +

    "<div class='loading'>" +

    "🔄 Mengambil daftar barang..." +

    "</div>";


  /*
   * ==========================================
   * AMBIL BARANG DALAM BATCH
   * ==========================================
   */

  ambilBarangByBatchId(
    pinjam
  );

}



function ambilBarangByBatchId(pinjam) {

  console.log(
    "📦 Mengambil barang dalam batch:",
    pinjam.batchId
  );


  /*
   * ==========================================
   * CALLBACK JSONP
   * ==========================================
   */

  const callbackName =
    "hasilBarangBatch_" +
    Date.now();


  window[callbackName] =
    function(response) {

      console.log(
        "📥 Response barang batch:",
        response
      );


      /*
       * Hapus callback
       */

      delete window[callbackName];


      /*
       * Jika gagal
       */

      if (!response.success) {

        const hasil =
          document.getElementById("hasil");

        hasil.innerHTML +=

          "<div class='info'>" +

          "❌ " +

          (
            response.message ||
            "Gagal mengambil daftar barang."
          ) +

          "</div>";

        return;

      }


      /*
       * Tampilkan daftar barang
       */

      tampilDaftarBarangBatch(
        pinjam,
        response
      );

    };


  /*
   * ==========================================
   * URL JSONP
   * ==========================================
   */

  const url =
    API_URL +

    "?action=getBarangByBatchId" +

    "&batchId=" +

    encodeURIComponent(
      pinjam.batchId
    ) +

    "&callback=" +

    callbackName;


  console.log(
    "🌐 URL Barang Batch:",
    url
  );


  /*
   * ==========================================
   * SCRIPT JSONP
   * ==========================================
   */

  const script =
    document.createElement("script");


  script.src =
    url;


  /*
   * Error koneksi
   */

  script.onerror =
    function() {

      console.error(
        "❌ Gagal mengambil barang dalam batch."
      );


      delete window[callbackName];


      const hasil =
        document.getElementById("hasil");

      hasil.innerHTML +=

        "<div class='info'>" +

        "❌ Gagal mengambil daftar barang." +

        "</div>";

    };


  document.body.appendChild(
    script
  );

}


function tampilDaftarBarangBatch(
  pinjam,
  response
) {

  const hasil =
    document.getElementById("hasil");


  let html = "";


  /*
   * ==========================================
   * INFORMASI BATCH
   * ==========================================
   */

  html +=

    "<div class='info'>" +

    "<b>📦 DAFTAR BARANG</b>" +

    "<br><br>" +

    "<b>Jumlah barang:</b> " +

    response.jumlah +

    "</div>";


  /*
   * ==========================================
   * DAFTAR BARANG
   * ==========================================
   */

  response.barang.forEach(
    function(item, index) {

      html +=

        "<div class='keranjang-item'>" +

        "<b>" +

        (index + 1) +

        ". " +

        (item.namaBarang || "-") +

        "</b>" +

        "<br>" +

        "<small>" +

        "Kode Register: " +

        (item.kodeRegister || "-") +

        "</small>" +

        "<br>" +

        "<small>" +

        "NUP: " +

        (item.nup || "-") +

        "</small>" +

        "<br>" +

        "<small>" +

        "Ruangan: " +

        (item.ruanganAsal || "-") +

        "</small>" +


        /*
         * ==================================
         * DROPDOWN KONDISI
         * ==================================
         */

        "<div class='form-group'>" +

        "<label>Kondisi Saat Kembali</label>" +

        "<select " +

        "class='kondisi-barang' " +

        "data-kode='" +

        (item.kodeRegister || "") +

        "'>" +

        "<option value='Baik'>Baik</option>" +

        "<option value='Rusak Ringan'>Rusak Ringan</option>" +

        "<option value='Rusak Berat'>Rusak Berat</option>" +

        "</select>" +

        "</div>" +

        "</div>";

    }
  );


  /*
   * ==========================================
   * CATATAN
   * ==========================================
   */

  html +=

    "<div class='form-group'>" +

    "<label>Catatan Pengembalian</label>" +

    "<textarea " +

    "id='catatanMassal' " +

    "placeholder='Catatan pengembalian'></textarea>" +

    "</div>";


  /*
   * ==========================================
   * TOMBOL KEMBALIKAN
   * ==========================================
   */

  html +=

    "<button " +

    "class='btn-kembali' " +

    "onclick='konfirmasiPengembalianMassal(" +

    JSON.stringify(pinjam) +

    "," +

    JSON.stringify(response.barang) +

    ")'>" +

    "↩️ KEMBALIKAN SEMUA BARANG" +

    "</button>";


  /*
   * ==========================================
   * TOMBOL BATAL
   * ==========================================
   */

  html +=

    "<button " +

    "class='btn-scan' " +

    "onclick='location.reload()'>" +

    "❌ BATAL" +

    "</button>";


  /*
   * ==========================================
   * TAMPILKAN
   * ==========================================
   */

  hasil.innerHTML =
    hasil.innerHTML +
    html;

}
  
function konfirmasiPengembalianMassal(
  pinjam,
  barang
) {

  let daftarBarang = "";


  /*
   * ==========================================
   * BUAT DAFTAR BARANG
   * ==========================================
   */

  barang.forEach(
    function(item, index) {

      daftarBarang +=

        (index + 1) +
        ". " +
        (item.namaBarang || "-") +

        "\n" +

        "   NUP: " +
        (item.nup || "-") +

        "\n" +

        "   Kode: " +
        (item.kodeRegister || "-") +

        "\n\n";

    }
  );


  /*
   * ==========================================
   * KONFIRMASI
   * ==========================================
   */

  const yakin =
    confirm(

      "⚠️ KONFIRMASI PENGEMBALIAN\n\n" +

      "Anda akan mengembalikan " +

      barang.length +

      " barang sekaligus.\n\n" +

      "Batch ID:\n" +

      pinjam.batchId +

      "\n\n" +

      "Peminjam:\n" +

      (pinjam.namaPeminjam || "-") +

      "\n\n" +

      "DAFTAR BARANG:\n\n" +

      daftarBarang +

      "Apakah Anda yakin ingin mengembalikan semua barang tersebut?"

    );


  /*
   * ==========================================
   * BATAL
   * ==========================================
   */

  if (!yakin) {

    console.log(
      "Pengembalian massal dibatalkan."
    );

    return;

  }


  /*
   * ==========================================
   * LANJUTKAN
   * ==========================================
   */

  prosesPengembalianMassal(
    pinjam
  );

}
  

 

function ambilRiwayatBarang(kodeQR) {

  console.log(
    "Mengambil riwayat:",
    kodeQR
  );

  const callbackName =
    "hasilRiwayat_" +
    Date.now();

  /*
   * Callback JSONP
   */

  window[callbackName] =
    function(response) {

      console.log(
        "Response riwayat:",
        response
      );

      /*
       * Hapus callback
       */

      delete window[callbackName];

      /*
       * Tampilkan hasil
       */

      tampilRiwayat(response);

    };

  /*
   * Buat URL JSONP
   */

  const url =

  function cariNamaPegawai(keyword) {

  /*
   * ==========================================
   * VALIDASI INPUT
   * ==========================================
   */

  const hasilPegawai =
    document.getElementById(
      "hasilPegawai"
    );


  if (!hasilPegawai) {
    return;
  }


  keyword =
    String(
      keyword || ""
    ).trim();


  /*
   * Kosongkan hasil jika
   * keyword terlalu pendek
   */

  if (
    keyword.length < 2
  ) {

    hasilPegawai.innerHTML =
      "";

    return;

  }


  /*
   * ==========================================
   * TAMPILKAN LOADING
   * ==========================================
   */

  hasilPegawai.innerHTML =

    "<div class='info'>" +

    "🔎 Mencari pegawai..." +

    "</div>";


  /*
   * ==========================================
   * CALLBACK JSONP
   * ==========================================
   */

  const callbackName =
    "hasilCariPegawai_" +
    Date.now();


  window[callbackName] =
    function(response) {

      console.log(
        "📥 Response cari pegawai:",
        response
      );


      /*
       * Hapus callback
       */

      delete window[
        callbackName
      ];


      /*
       * ======================================
       * JIKA GAGAL
       * ======================================
       */

      if (
        !response ||
        !response.success
      ) {

        hasilPegawai.innerHTML =

          "<div class='info'>" +

          "❌ Gagal mencari data pegawai." +

          "</div>";

        return;

      }


      /*
       * ======================================
       * TIDAK DITEMUKAN
       * ======================================
       */

      if (
        !response.pegawai ||
        response.pegawai.length === 0
      ) {

        hasilPegawai.innerHTML =

          "<div class='info'>" +

          "❌ Pegawai tidak ditemukan." +

          "<br><br>" +

          "<button " +

          "class='btn-scan' " +

          "onclick='gunakanPeminjamManual()'>" +

          "➕ Gunakan Peminjam Manual" +

          "</button>" +

          "</div>";

        return;

      }


      /*
       * ======================================
       * TAMPILKAN HASIL
       * ======================================
       */

      let html = "";


      response.pegawai.forEach(
        function(pegawai, index) {

          html +=

            "<div " +

            "class='pegawai-item' " +

            "onclick='pilihPegawai(" +

            JSON.stringify(

            ")'>" +

            "<b>" +

            "</small>" +

            "<br>" +

            "<small>" +

            "Jabatan: " +

            (
              pegawai.jabatan ||
              "Tidak tersedia"
            ) +

            "</small>" +

            "</div>";

        }
      );


      hasilPegawai.innerHTML =
        html;

    };


  /*
   * ==========================================
   * URL APPS SCRIPT
   * ==========================================
   */

  const url =
    API_URL +

    "?action=cariPegawai" +

    "&keyword=" +

    encodeURIComponent(
      keyword
    ) +

    "&callback=" +

    callbackName;


  console.log(
    "🌐 URL Cari Pegawai:",
    url
  );


  /*
   * ==========================================
   * KIRIM JSONP
   * ==========================================
   */

  const script =
    document.createElement(
      "script"
    );


  script.src =
    url;


  script.onerror =
    function() {

      console.error(
        "❌ Gagal mencari pegawai."
      );


      delete window[
        callbackName
      ];


      hasilPegawai.innerHTML =

        "<div class='info'>" +

        "❌ Gagal menghubungi server." +

        "</div>";

    };


  document.body.appendChild(
    script
  );

  if (!keperluan) {

  }

  /*

   */

      if (!response.success) {

        tampilError(
          response.message
        );

      document.getElementById(

/*
 * ==========================================
 * JSONP UMUM
 * ==========================================
 */

function panggilJSONP(
  fungsi,
  data,
  callback
) {

  /*
   * Untuk tahap awal,
   * kita akan menggunakan parameter
   * action pada Apps Script.
   */

  const callbackName =
    "callback_" +
    Date.now();


  window[callbackName] =
    callback;


  const url =
    API_URL +
    "?action=" +
    encodeURIComponent(fungsi) +
    "&data=" +
    encodeURIComponent(
      JSON.stringify(data)
    ) +
    "&callback=" +
    callbackName;


  const script =
    document.createElement(
      "script"
    );


  script.src =
    url;


  script.onerror =
    function() {

      delete window[callbackName];

      tampilError(
        "Gagal menghubungi server Apps Script."
      );

    };


  document.body.appendChild(
    script
  );

}


/*
 * ==========================================
 * ERROR
 * ==========================================
 */

function tampilError(pesan) {

  const error =
    document.getElementById(
      "error"
    );


  error.style.display =
    "block";


  error.innerHTML =
    "❌ " + pesan;

}


/*
 * ==========================================
 * FORMAT TANGGAL
 * ==========================================
 */

function formatTanggal(tanggal) {

  if (!tanggal) {

    return "-";

  }


  const d =
    new Date(tanggal);


  if (isNaN(d)) {

    return tanggal;

  }


  return d.toLocaleDateString(
    "id-ID",
    {
      day: "2-digit",
      month: "long",
      year: "numeric"
    }
  );

}
